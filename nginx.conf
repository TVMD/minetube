limit_req_zone $binary_remote_addr zone=yt:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=invidious_login:1m rate=5r/m;

server {
    listen 80;
    server_name minetube.ddns.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name minetube.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/minetube.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minetube.ddns.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    limit_req zone=yt burst=60 nodelay;
    auth_request /_invidious_session;
    error_page 401 403 = @login_required;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;

    # Video streaming through the proxy.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /_invidious_session {
        internal;
        auth_request off;
        # Invidious validates SID against its sessions; cookie presence is insufficient.
        proxy_pass http://invidious:3000/api/v1/auth/preferences;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_required {
        return 302 /login;
    }

    location = /login {
        auth_request off;
        limit_req zone=invidious_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://invidious:3000;
    }

    location = / {
        rewrite ^/$ /feed/history last;
    }

    # Only static login assets are public; all other routes require a session.
    location ~ ^/(?:css/|js/|fonts/|(?:favicon(?:-16x16|-32x32)?\.png|favicon\.ico|apple-touch-icon\.png|site\.webmanifest|safari-pinned-tab\.svg)$) {
        auth_request off;
        proxy_pass http://invidious:3000;
    }

    location / {
        proxy_pass http://invidious:3000;
        add_header Cache-Control "private, no-store" always;
    }
}
