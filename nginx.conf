limit_req_zone $binary_remote_addr zone=yt:10m rate=20r/s;

server {
    listen 80;
    server_name minetube.ddns.net;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name minetube.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/minetube.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minetube.ddns.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Optional basic auth (also uncomment the .htpasswd volume in compose)
    auth_basic           "Private";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 10m;

    location / {
        limit_req zone=yt burst=60 nodelay;

        proxy_pass http://invidious:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        # Video streaming through the proxy
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
